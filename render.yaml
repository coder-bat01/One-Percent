services:
  - type: web
    name: one-percent
    runtime: docker
    # Free instances cannot attach a persistent disk. Data is ephemeral: it is
    # lost on redeploy, restart, or after the service sleeps from inactivity.
    # Switch to a paid plan and re-add the disk block to keep data.
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /app/.data/one-percent.sqlite
      - key: PORT
        value: "10000"
