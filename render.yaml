services:
  - type: web
    name: one-percent
    runtime: docker
    # Persistent disks require a paid instance type.
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /data/one-percent.sqlite
      - key: PORT
        value: "10000"
    disk:
      name: one-percent-data
      mountPath: /data
      sizeGB: 1
