services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      # Localhost only. Put a TLS reverse proxy in front for a public host.
      - "127.0.0.1:3000:3000"
    environment:
      # Set to true when a reverse proxy terminates HTTPS for a public host.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DATABASE_PATH: /data/one-percent.sqlite
      HOSTNAME: 0.0.0.0
    volumes:
      - one-percent-data:/data

volumes:
  one-percent-data:
